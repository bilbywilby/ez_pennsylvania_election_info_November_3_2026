name: Deploy to Pages & Wiki

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'docs/**'
      - '.github/workflows/deploy-pages-wiki.yml'
  
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target (pages, wiki, both)'
        required: true
        default: 'both'
        type: choice
        options: [pages, wiki, both]

jobs:
  deploy-pages:
    if: github.event.inputs.target == 'pages' || github.event.inputs.target == 'both' || github.event.action == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-wiki:
    if: github.event.inputs.target == 'wiki' || github.event.inputs.target == 'both' || github.event.action == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Sync to Wiki
        env:
          # OPSEC: Using PAT instead of GITHUB_TOKEN for cross-repo access
          WIKI_TOKEN: ${{ secrets.WIKI_SYNC_TOKEN }}
        run: |
          git clone https://x-access-token:${WIKI_TOKEN}@github.com/${{ github.repository }}.wiki.git wiki-temp
          # Use rsync or targeted cp to avoid overwriting .git metadata
          cp -R docs/. wiki-temp/
          cd wiki-temp
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git diff-index --quiet HEAD || git commit -m "Sync from main repo: ${{ github.sha }}"
          git push origin master

  notify:
    needs: [deploy-pages, deploy-wiki]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Deployment Summary
        run: |
          echo "## Deployment Status" >> $GITHUB_STEP_SUMMARY
          echo "- Pages: ${{ needs.deploy-pages.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Wiki: ${{ needs.deploy-wiki.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Timestamp: $(date)" >> $GITHUB_STEP_SUMMARY
