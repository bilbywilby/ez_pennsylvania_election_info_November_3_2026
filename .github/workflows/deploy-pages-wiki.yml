name: Deploy to Pages & Wiki

on:
  # Trigger on push to main branch
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'docs/**'
      - '.github/workflows/deploy-pages-wiki.yml'
  
  # Optional: Manual trigger via API/CLI
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target (pages, wiki, both)'
        required: true
        default: 'both'
        type: choice
        options:
          - pages
          - wiki
          - both

jobs:
  # =====================
  # JOB 1: Deploy to GitHub Pages
  # =====================
  deploy-pages:
    if: github.event.inputs.target == 'pages' || github.event.inputs.target == 'both' || !github.event.inputs.target
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
        permissions:
          pages: write
          id-token: write

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'  # Change to your site folder

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # =====================
  # JOB 2: Sync to GitHub Wiki
  # =====================
  deploy-wiki:
    if: github.event.inputs.target == 'wiki' || github.event.inputs.target == 'both' || !github.event.inputs.target
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Clone Wiki Repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Wiki is a separate git repo at {repo}.wiki.git
          git clone https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git wiki-temp
      
      - name: Copy docs to wiki
        run: |
          cp -r docs/* wiki-temp/ 2>/dev/null || true
          cd wiki-temp
          echo "Updated by GitHub Actions at $(date)" >> LAST_SYNC.txt
      
      - name: Commit and push wiki changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd wiki-temp
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git diff-index --quiet HEAD || git commit -m "Sync from main repo: ${{ github.sha }}"
          git push origin master

  # =====================
  # JOB 3: Notification (Optional)
  # =====================
  notify:
    needs: [deploy-pages, deploy-wiki]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Deployment Summary
        run: |
          echo "## Deployment Status" >> $GITHUB_STEP_SUMMARY
          echo "- Pages: ${{ needs.deploy-pages.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Wiki: ${{ needs.deploy-wiki.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Timestamp: $(date)" >> $GITHUB_STEP_SUMMARY
