name: Deploy to Pages & Wiki

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target (pages, wiki, both)'
        required: true
        default: 'both'
        type: choice
        options: [pages, wiki, both]
  repository_dispatch:
    types: [deploy]

jobs:
  deploy-pages:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
        (inputs.target == 'pages' || inputs.target == 'both')) ||
      (github.event_name == 'repository_dispatch' &&
        (github.event.client_payload.target == 'pages' || github.event.client_payload.target == 'both'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-wiki:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
        (inputs.target == 'wiki' || inputs.target == 'both')) ||
      (github.event_name == 'repository_dispatch' &&
        (github.event.client_payload.target == 'wiki' || github.event.client_payload.target == 'both'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Sync to Wiki
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_SYNC_TOKEN }}
        run: |
          if [[ -z "$WIKI_TOKEN" ]]; then
            echo "WIKI_SYNC_TOKEN is required to deploy the wiki." >&2
            exit 1
          fi
          askpass="$RUNNER_TEMP/wiki-askpass.sh"
          cat > "$askpass" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$WIKI_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$askpass"
          trap 'rm -f "$askpass"' EXIT
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
            git clone "https://github.com/${GITHUB_REPOSITORY}.wiki.git" wiki-temp
          cp -R docs/. wiki-temp/
          cd wiki-temp
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          if ! git diff-index --quiet HEAD; then
            git commit -m "Sync from main repo: ${GITHUB_SHA}"
            GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git push origin HEAD
          fi

  notify:
    needs: [deploy-pages, deploy-wiki]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Deployment Summary
        run: |
          echo "## Deployment Status" >> $GITHUB_STEP_SUMMARY
          echo "- Pages: ${{ needs.deploy-pages.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Wiki: ${{ needs.deploy-wiki.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Timestamp: $(date)" >> $GITHUB_STEP_SUMMARY
